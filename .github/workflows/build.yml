name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # A v* tag also publishes a GitHub Release with the installers attached.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installers for the in-app updater (latest.json + .sig in the release).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: PokeTokenBar for Windows ${{ github.ref_name }}
          # Users install with the NSIS .exe (install.ps1), so updates must use it too;
          # an .msi update would install a second copy elsewhere.
          updaterJsonPreferNsis: true
          releaseBody: |
            ## 설치 / 업데이트

            PowerShell에서 한 줄 실행 (관리자 권한 불필요, 실행 중인 앱은 자동 종료):

            ```powershell
            irm https://raw.githubusercontent.com/tkdals2317/PokeTokenBar-Windows/main/install.ps1 | iex
            ```

            또는 아래 `PokeTokenBar_*_x64-setup.exe`를 받아 실행하세요. 서명이 없어 SmartScreen 경고가 뜨면 "추가 정보 → 실행"을 누르세요.
            이미 설치돼 있다면 앱 안의 설정 → 업데이트에서도 업데이트할 수 있어요.
      - uses: actions/upload-artifact@v4
        with:
          name: poketokenbar-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
